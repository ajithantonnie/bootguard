# Custom BootGuard Configurations for Demo App
# This file overrides the defaults found in bootguard-default.properties

# 1. Tuning the Secret Detection Engine
# (Example: set impossible thresholds here for demo purposes to skip entropy checks)
metric.entropy.threshold=1.1
metric.entropy.high.threshold=1.2
# Ignore short secrets under 10 characters
secret.min.length=10

# 2. Directory Filtering
# Skip additional folders like 'legacy-code'
ignore.directories=.git,target,node_modules,build,dist,.idea,legacy-code

# 3. Custom Keyword Targeting
# Add company-specific variable naming conventions (like 'preshared' or 'accesskey')
secret.keyword.pattern=(?i)(password|secret|key|token|api|auth|credential|private|signing|jwt|pat|bearer|preshared|accesskey)

# 4. Strict File Monitoring
# Also flag if anyone commits test or QA environment config files
sensitive.files.pattern=-prod.yml,-prod.yaml,-prod.properties,.env,-qa.yml,-test.yml
