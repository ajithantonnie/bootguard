server:
  port: 8080
  server-header: "Apache/2.4.41 (Ubuntu)" # Fingerprinting risk
  error:
    include-stacktrace: always # High exposure risk
    include-message: always # Medium exposure risk

spring:
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3306/db?useSSL=false
    username: root
    password: admin123 # Hardcoded password
  web:
    security:
      header:
        xss:
          enabled: false # XSS protection disabled
    cors:
      allowed-origins: "*" # CORS wildcard
      allowed-methods: "*"
  h2:
    console:
      enabled: true # H2 console exposed
      path: /h2-console
      settings:
        web-allow-others: true # H2 console allows external access

management:
  endpoints:
    web:
      exposure:
        include: "*" # Actuator fully exposed
  server:
    port: 8080 # Same as server.port, increases exposure risk

debug: true # Debug mode enabled

